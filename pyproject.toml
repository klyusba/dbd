[project]
name = "dbd"
version = "0.1.0"
authors = [
  {name = "Boris Klyus", email = "klyusba@gmail.com"}
]
maintainers = [
  {name = "Boris Klyus", email = "klyusba@gmail.com"}
]
description = "database daemon - run your dbt models via http"
keywords = ["dbt", "http", "service"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "google-cloud-storage>=2.18",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/klyusba/dbd"
Documentation = "https://github.com/klyusba/dbd"
Repository = "https://github.com/klyusba/dbd.git"
Issues = "https://github.com/klyusba/dbd/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "dbt-duckdb>=1.10",
]

[project.optional-dependencies]
postgres = [
    "dbt-postgres>=1.8",
]
bigquery = [
    "dbt-bigquery>=1.8",
]

[project.scripts]
dbd-manager = "dbd.manager:main"
dbd-worker = "dbd.worker:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
